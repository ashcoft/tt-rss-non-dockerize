version: 2

updates:
- package-ecosystem: composer
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: 'Composer:'

- package-ecosystem: npm
  directory: /
  schedule:
    interval: monthly
  commit-message:
    prefix: 'npm:'
  groups:
    development-dependencies:
      dependency-type: development
  ignore:
    # typescript-eslint only supports TypeScript <6.1; hold TS at 6.x until
    # it adds support for the TS 7 API.
    - dependency-name: 'typescript'
      versions: ['>=7.0.0']
    # The conventionalcommits v10 preset requires conventional-changelog-writer@9+,
    # but @semantic-release/release-notes-generator@14 pins writer@8, so rendering
    # the preset aborts the Release workflow at generateNotes. Hold at 9.x until
    # the stable semantic-release plugins move to writer@9.
    - dependency-name: 'conventional-changelog-conventionalcommits'
      versions: ['>=10.0.0']

- package-ecosystem: docker
  directories:
  - /.docker/app
  - /.docker/web-nginx
  schedule:
    interval: weekly
  commit-message:
    prefix: 'Docker:'

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: 'GitHub Actions:'
