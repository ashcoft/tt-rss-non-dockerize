name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ============================================
  # JOB 1: Build Legacy (Dojo) Assets
  # ============================================
  build-legacy:
    name: Build Legacy (Dojo) Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Ensure zip available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

      - name: Create legacy tar.gz
        run: |
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='*.log' \
              --exclude='*.tmp' \
              --exclude='*.ts' \
              --exclude='*.less' \
              --exclude='package-lock.json' \
              --exclude='pnpm-lock.yaml' \
              --exclude='dist' \
              -czf /tmp/tt-rss-legacy.tar.gz . && mv /tmp/tt-rss-legacy.tar.gz .

      - name: Create legacy zip
        run: |
          zip -r tt-rss-legacy.zip . \
              -x '.git/*' \
              -x '.github/*' \
              -x 'node_modules/*' \
              -x '*.log' \
              -x '*.tmp' \
              -x '*.ts' \
              -x '*.less' \
              -x 'package-lock.json' \
              -x 'pnpm-lock.yaml' \
              -x 'dist/*' \
              -x '*.tar.gz'

      - name: Upload legacy artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tt-rss-legacy-assets
          path: |
            tt-rss-legacy.tar.gz
            tt-rss-legacy.zip
          retention-days: 1
          compression-level: 6
          overwrite: true

  # ============================================
  # JOB 2: Build Vue Assets
  # ============================================
  build-vue:
    name: Build Vue Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Build Vue
        run: pnpm run build

      - name: Ensure zip available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

      - name: Create Vue tar.gz
        run: |
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='dist' \
              --exclude='*.log' \
              --exclude='*.tmp' \
              --exclude='package-lock.json' \
              --exclude='pnpm-lock.yaml' \
              -czf /tmp/tt-rss-vue.tar.gz . && mv /tmp/tt-rss-vue.tar.gz .

      - name: Create Vue zip
        run: |
          zip -r tt-rss-vue.zip . \
              -x '.git/*' \
              -x '.github/*' \
              -x 'node_modules/*' \
              -x 'dist/*' \
              -x '*.log' \
              -x '*.tmp' \
              -x 'package-lock.json' \
              -x 'pnpm-lock.yaml' \
              -x '*.tar.gz'

      - name: Upload Vue artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tt-rss-vue-assets
          path: |
            tt-rss-vue.tar.gz
            tt-rss-vue.zip
          retention-days: 1
          compression-level: 6
          overwrite: true

  # ============================================
  # JOB 3: Combined Release
  # ============================================
  release:
    name: Release (Both Versions)
    runs-on: ubuntu-latest
    needs: [build-legacy, build-vue]
    if: github.repository_owner == 'ashcoft'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Download legacy artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tt-rss-legacy-assets
          path: .

      - name: Download Vue artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tt-rss-vue-assets
          path: .

      - name: Verify artifacts
        run: |
          echo "=== Legacy Artifacts ==="
          ls -la tt-rss-legacy.* || echo "No legacy artifacts found"
          echo "=== Vue Artifacts ==="
          ls -la tt-rss-vue.* || echo "No Vue artifacts found"

      - name: Semantic Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

      - name: Upload both artifacts to release
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "Uploading release assets for: $TAG"
          
          # Upload legacy assets
          if [ -f tt-rss-legacy.tar.gz ]; then
            gh release upload "$TAG" tt-rss-legacy.tar.gz --clobber
            gh release upload "$TAG" tt-rss-legacy.zip --clobber
          fi
          
          # Upload Vue assets
          if [ -f tt-rss-vue.tar.gz ]; then
            gh release upload "$TAG" tt-rss-vue.tar.gz --clobber
            gh release upload "$TAG" tt-rss-vue.zip --clobber
          fi
          
          echo "=== Uploaded ==="
          gh release view "$TAG" --json assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
