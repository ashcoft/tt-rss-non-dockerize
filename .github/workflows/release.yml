name: Release
on:
  push:
    branches:
      - main
      - vite-migration
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ============================================
  # JOB 1: Build Legacy (Dojo) Package
  # Produces tt-rss.tar.gz / tt-rss.zip (main release asset)
  # ============================================
  build-legacy:
    name: Build Legacy (Dojo) Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref_name == 'main' && github.repository_owner == 'ashcoft'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure zip available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

      # .gitattributes `export-ignore` is the single source of truth for what
      # is development-only: `git archive` leaves those paths out, so only
      # runtime files are staged and packaged.
      - name: Stage production files
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/stage"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/stage"

      - name: Verify no development files are staged
        run: |
          cd "$RUNNER_TEMP/stage"
          leaked=$(find . \( \
              -path './.git*' -o -path './.circleci' -o -path './src' \
              -o -path './tests*' -o -path './node_modules' \
              -o -name 'package.json' -not -path './lib/*' \
              -o -name 'package-lock.json' -o -name 'pnpm-lock.yaml' \
              -o -name '*.less' -o -name '*.ts' -o -name '*.po' \
              -o -name 'phpunit*.xml' -o -name 'phpstan.neon' \
              -o -path './composer.*' -o -name '*.config.js' \
            \) -print)
          if [ -n "$leaked" ]; then
            echo "::error::Development files found in the release payload:"
            echo "$leaked"
            exit 1
          fi
          for required in index.php config.php-dist vendor/autoload.php vendor/guzzlehttp/guzzle/src/Client.php lib/dojo/dojo.js locale/de_DE/LC_MESSAGES/messages.mo; do
            [ -e "$required" ] || { echo "::error::Missing runtime file: $required"; exit 1; }
          done

      - name: Create tt-rss.tar.gz
        run: tar -C "$RUNNER_TEMP/stage" -czf tt-rss.tar.gz .

      - name: Create tt-rss.zip
        run: |
          cd "$RUNNER_TEMP/stage"
          zip -qr "$GITHUB_WORKSPACE/tt-rss.zip" .

      - name: Upload tt-rss artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tt-rss-assets
          path: |
            tt-rss.tar.gz
            tt-rss.zip
          retention-days: 1
          compression-level: 6
          overwrite: true

  # ============================================
  # JOB 2: Build & Release Vue App (vite-migration only)
  # Publishes compiled Vue assets to the rolling tt-rss-dev tag.
  # ============================================
  release-vue:
    name: Build & Release Vue App
    runs-on: ubuntu-latest
    if: github.ref_name == 'vite-migration' && github.repository_owner == 'ashcoft'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Build Vue app
        run: pnpm run build

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la dist/ || { echo "dist/ missing - Vue build produced no output"; exit 1; }
          find dist -type f | head -20

      - name: Ensure zip available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

      # Same production payload as the legacy package (see .gitattributes
      # `export-ignore`), plus the compiled Vue app from dist/.
      - name: Stage production files
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/stage"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/stage"
          cp -R dist "$RUNNER_TEMP/stage/dist"

      - name: Create tt-rss.tar.gz
        run: tar -C "$RUNNER_TEMP/stage" -czf tt-rss.tar.gz .

      - name: Create tt-rss.zip
        run: |
          cd "$RUNNER_TEMP/stage"
          zip -qr "$GITHUB_WORKSPACE/tt-rss.zip" .

      - name: Move tt-rss-dev tag
        run: |
          git tag -f tt-rss-dev
          git push origin tt-rss-dev --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update tt-rss-dev release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          RELEASE_TITLE="tt-rss-dev (${COMMIT_SHA:0:8})"
          RELEASE_NOTES="- Development build from the \`vite-migration\` branch.
          - Commit: ${COMMIT_SHA:0:8} - ${COMMIT_MSG}"

          if gh release view tt-rss-dev >/dev/null 2>&1; then
            echo "Updating existing tt-rss-dev release"
            gh release edit tt-rss-dev \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --draft=false
          else
            echo "Creating tt-rss-dev release"
            gh release create tt-rss-dev \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --latest=false
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Vue assets to tt-rss-dev release
        run: |
          gh release upload tt-rss-dev tt-rss.tar.gz tt-rss.zip --clobber
          echo "=== Uploaded ==="
          gh release view tt-rss-dev --json assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # JOB 3: Legacy Release (main only)
  # ============================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-legacy]
    if: github.ref_name == 'main' && github.repository_owner == 'ashcoft'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Download tt-rss artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tt-rss-assets
          path: .

      - name: Verify artifacts
        run: |
          ls -la tt-rss.* || echo "No tt-rss artifacts found"

      - name: Semantic Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

      - name: Upload tt-rss artifacts to release
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "Uploading release assets for: $TAG"
          if [ -f tt-rss.tar.gz ]; then
            gh release upload "$TAG" tt-rss.tar.gz --clobber
            gh release upload "$TAG" tt-rss.zip --clobber
          fi
          echo "=== Uploaded ==="
          gh release view "$TAG" --json assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
