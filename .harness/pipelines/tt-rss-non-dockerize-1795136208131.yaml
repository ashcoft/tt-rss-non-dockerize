pipeline:
  identifier: Build_ashcoft_tt_rss_non_dockerize_1795136216781
  name: Build tt-rss-non-dockerize
  orgIdentifier: default
  projectIdentifier: default_project
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: account.Github_OAuth_1795136169630
        repoName: ashcoft/tt-rss-non-dockerize
  stages:
    - stage:
        identifier: build1
        name: build
        spec:
          caching:
            enabled: true
          cloneCodebase: true
          execution:
            steps:
              - step:
                  identifier: installdependencies
                  name: install dependencies
                  spec:
                    command: |-
                      # pnpm is the package manager this repo locks with (pnpm-lock.yaml).
                      command -v pnpm >/dev/null 2>&1 || npm install -g pnpm@9
                      pnpm install --ignore-scripts
                    timeout: ""
                    type: Run
              - step:
                  identifier: build
                  name: build
                  spec:
                    # Builds the Vue bundle in dist/ with Vite.
                    # PHP dependencies are vendored in the repo and validated by
                    # the GitHub Actions php-code-quality workflow, so there is
                    # no composer step here.
                    command: pnpm run build
                    timeout: ""
                    type: Run
          platform:
            arch: Amd64
            os: Linux
          runtime:
            spec: {}
            type: Cloud
        type: CI
