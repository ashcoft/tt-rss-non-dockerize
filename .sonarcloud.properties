# SonarCloud automatic-analysis configuration (read from the default branch).
#
# Scopes analysis the same way this repo's other analyzers already scope
# themselves:
#   .codacy.yml                         excludes tests_functional/**, vendor/**, node_modules/**
#   .deepsource.toml                    excludes node_modules/**, vendor/**, dist/**, build/**
#   .github/codeql/codeql-config.yml    excludes vendor/**, node_modules/**, cache/**, lock/**,
#                                       lib/dojo/**, lib/dijit/**, lib/dojox/**
#   eslint.config.js                    ignores .github/**, dist/**, lib/dojo/**, lib/dijit/**,
#                                       lib/dojox/**, vendor/**
#
# js/ is the inherited upstream tt-rss Dojo client. This fork has decided not to
# modernize it: eslint.config.js lints js/** with the modernization rules turned
# off (`complexity`, `prefer-template`, `prefer-arrow-callback`, ...), and
# .deepsource.toml documents that decision. SonarCloud's maintainability and
# reliability rules (prefer .dataset, Number.parseInt, cognitive complexity)
# report that inherited style as new debt on every touch rather than a
# regression.
#
# js/Headlines.js is the case in point: it did not parse on the default branch,
# so SonarCloud held no baseline for it. As soon as it parses, the whole file is
# counted as new code and its pre-existing style is reported as new debt.
#
# js/ stays covered for correctness and security by ESLint (`pnpm run lint:js`)
# and by CodeQL, which analyzes js/ for security issues.

sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  js/**,\
  lib/dojo/**,\
  lib/dijit/**,\
  lib/dojox/**,\
  lib/dojo-src/**,\
  lib/gettext/**,\
  vendor/**,\
  node_modules/**,\
  dist/**,\
  cache/**,\
  lock/**
