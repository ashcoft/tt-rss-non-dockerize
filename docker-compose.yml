services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ttrss
      POSTGRES_USER: ttrss
      POSTGRES_PASSWORD: ttrss
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttrss -d ttrss"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ghcr.io/ashcoft/tt-rss-non-dockerize:latest
    # build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TTRSS_DB_HOST: db
      TTRSS_DB_PORT: 5432
      TTRSS_DB_NAME: ttrss
      TTRSS_DB_USER: ttrss
      TTRSS_DB_PASS: ttrss
      TTRSS_SELF_URL_PATH: http://localhost:8080
      TTRSS_UPDATE_SCHEMA: "1"
    volumes:
      - cache:/var/www/html/cache
      - feed-icons:/var/www/html/feed-icons
    depends_on:
      db:
        condition: service_healthy

  updater:
    image: ghcr.io/ashcoft/tt-rss-non-dockerize:latest
    # build: .
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/php", "/var/www/html/update_daemon2.php"]
    environment:
      TTRSS_DB_HOST: db
      TTRSS_DB_PORT: 5432
      TTRSS_DB_NAME: ttrss
      TTRSS_DB_USER: ttrss
      TTRSS_DB_PASS: ttrss
      TTRSS_SELF_URL_PATH: http://localhost:8080
    volumes:
      - cache:/var/www/html/cache
      - feed-icons:/var/www/html/feed-icons
    depends_on:
      app:
        condition: service_started

volumes:
  db:
  cache:
  feed-icons:
