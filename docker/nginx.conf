worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # nginx's mime.types has no entry for either, and gzip_types below cannot
    # match a type a file never gets.
    types {
        application/manifest+json webmanifest;
        font/ttf                  ttf;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # OPML imports and plugin uploads go through POST bodies.
    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/manifest+json font/ttf;

    # tt-rss appends ?filemtime() to its own asset URLs; anything else keeps
    # revalidating so an upgrade cannot leave a stale bundle in a browser.
    map $args $ttrss_static_cache {
        default           "no-cache";
        "~^[0-9a-zA-Z]+$" "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        listen [::]:8080;
        root /var/www/html;
        index index.php;

        location = /healthz {
            rewrite ^ /public.php?op=healthcheck last;
        }

        # Configuration and dotfiles are never served directly.
        location = /config.php {
            deny all;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            try_files $fastcgi_script_name =404;

            fastcgi_index index.php;
            include fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
        }

        # Plugins that expose an /api/ directory rely on PATH_INFO.
        location ~ /plugins\.local/.*/api/.*\.php(/|$) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            try_files $fastcgi_script_name =404;

            set $path_info $fastcgi_path_info;
            fastcgi_param PATH_INFO $path_info;

            fastcgi_index index.php;
            include fastcgi.conf;
            fastcgi_pass 127.0.0.1:9000;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control $ttrss_static_cache;
        }
    }
}
