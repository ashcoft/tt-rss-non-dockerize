[www]
listen = 127.0.0.1:9000
chdir = /var/www/html

; tt-rss is configured through TTRSS_* environment variables; the default
; clear_env would strip them before the workers see them.
clear_env = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
