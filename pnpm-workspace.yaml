packages:
  - '.'
allowBuilds:
  # postinstall only warns about stale generated model types and is a no-op in
  # published packages (no src/); nothing to build, so deny it.
  '@openrouter/sdk': false
  '@parcel/watcher': true
  esbuild: true
overrides:
  # GHSA-g3hv-75wg-m249 again, in the copy of minimatch bundled inside the npm
  # CLI. Bundled dependencies cannot be overridden and no npm release ships the
  # fixed 11.0.1, so the npm CLI itself is dropped. It is only a dependency of
  # @semantic-release/npm, a plugin .releaserc.json does not load.
  '@semantic-release/npm>npm': '-'
  esbuild@>=0 <0.28.1: '0.28.1'
  # GHSA-g3hv-75wg-m249: globparts amplification in firstPhasePreProcess().
  # Every dependent (eslint, @eslint/config-array, typescript-estree) asks for
  # ^10.x, so the fixed 11.0.1 has to be forced.
  minimatch@>=10.0.0 <11.0.1: '11.0.1'
  # GHSA-xjj6-f33q-929c and related DoS advisories in undici:
  #   6.x is vulnerable below 6.29.1 (@actions/http-client -> ^6.23.0)
  #   7.x is vulnerable below 7.30.1 (@semantic-release/github -> ^7.0.0)
  undici@>=6.0.0 <7.0.0: '6.29.1'
  undici@>=7.0.0 <8.0.0: '7.30.1'
