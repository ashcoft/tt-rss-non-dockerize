packages:
  - '.'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
overrides:
  esbuild@>=0 <0.28.1: '0.28.1'
  # GHSA-xjj6-f33q-929c and related DoS advisories in undici:
  #   6.x is vulnerable below 6.29.1 (@actions/http-client -> ^6.23.0)
  #   7.x is vulnerable below 7.30.1 (@semantic-release/github -> ^7.0.0)
  undici@>=6.0.0 <7.0.0: '6.29.1'
  undici@>=7.0.0 <8.0.0: '7.30.1'
